[project]
name = "microair-bt"
version = "0.1.0"
description = "Local Bluetooth protocol library for MicroAir EasyStart"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["bleak>=3.0.2", "bleak-retry-connector>=4.7.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
explicit_package_bases = true
